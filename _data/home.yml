# Drives the homepage. Now / Soon and the next adventure come from plan.yml,
# and the photos and posts come from the blog.

blurb: >-
  I’m a software engineer who’d rather be outside. I’ve made apps since the
  first day of the App Store and spent the last few years at Apple. Now I’m
  trading city life for my DIY camper van again to dive, hike, and see what’s
  out there.

# Shown as chips.
#   type:  optional plan.yml type, used for the chip's color
