# Drives /plan.
#
# Each event takes:
#   date:        start date (YYYY-MM-DD)
#   end:         optional end date. Events with one are styled as a span,
#                events without as a single day
#   when:        optional text shown instead of the formatted dates
#   title:       what's happening
#   location:    place, shown with a pin under the title. Every event has one
#   type:        kind of activity, shown as a badge: scuba, hiking, family, van,
#                travel, house, work, party, holiday, errand, life, concert, wedding, or flight.
#                Flights also get a plane icon in front of the title
#   to:          flights only. Where the flight lands, so the homepage knows
#                where I am after it
#   status:      leave off when it's firm. Otherwise tentative or loose, which
#                are drawn dashed instead of filled
#   notes:       optional list of bullet points
#   progress:    optional, shown as a bar on the homepage while the event is
#                happening. Takes done, total, and unit, e.g. for the PCT:
#                {done: 1204, total: 2650, unit: miles}
#
# The homepage shows where I am now and where I'm going next from this, but
# only the city (venues are dropped) and never the exact dates.

